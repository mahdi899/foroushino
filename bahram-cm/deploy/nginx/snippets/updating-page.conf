# When Next.js (PM2 :3000) is down during rebuild / crash, show a branded page
# instead of the default Nginx 502. Direct PHP-FPM locations are unaffected.
#
# Installed to: /etc/nginx/snippets/updating-page.conf
# HTML:          /var/www/bahram-cm/deploy/nginx/html/updating.html

error_page 502 504 =503 /__updating.html;
error_page 503 /__updating.html;

# Convert upstream 5xx from a half-dead Node into our page as well.
proxy_intercept_errors on;

location = /__updating.html {
    internal;
    alias /var/www/bahram-cm/deploy/nginx/html/updating.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Retry-After "60" always;
}
