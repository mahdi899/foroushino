# Micro-cache for guest HTML coming out of Next.js (rostami.app + rostami.club).
#
# Installed ONCE to /etc/nginx/conf.d/rostami-microcache.conf (auto-included).
#
# Why: /cart, /purchase/*, /reference-channels/* and the marketing pages are
# `force-dynamic`, so every campaign visitor triggers a full SSR render plus
# several Laravel round-trips. During the kanal-mrgf campaign this saturated the
# single Next.js process and produced "upstream timed out" for everyone.
#
# A 5-second cache is invisible to users (prices/stock move far slower than that)
# but collapses thousands of identical guest renders into one upstream request.
#
# Logged-in traffic is never cached: any request carrying a session/student cookie
# or a non-GET method bypasses the cache entirely (see $rostami_no_cache).

proxy_cache_path /var/cache/nginx/rostami_next
    levels=1:2
    keys_zone=rostami_next_cache:32m
    max_size=1g
    inactive=10m
    use_temp_path=off;

# Any authenticated marker disables caching for that request.
map $http_cookie $rostami_auth_cookie {
    default                          0;
    "~*(^|;\s*)student_token="       1;
    "~*(^|;\s*)bahram_session="      1;
    "~*(^|;\s*)laravel_session="     1;
    "~*(^|;\s*)XSRF-TOKEN="          1;
    "~*(^|;\s*)family_token="        1;
}

# Private surfaces must always hit the origin, cached or not.
map $uri $rostami_private_uri {
    default            0;
    "~^/panel"         1;
    "~^/admin"         1;
    "~^/api/"          1;
    "~^/sso/"          1;
    "~^/family/create" 1;
}

map $request_method $rostami_write_method {
    default 1;
    GET     0;
    HEAD    0;
}

# 1 => skip cache. Combined below so a single flag drives both bypass and no-cache.
map "$rostami_auth_cookie$rostami_private_uri$rostami_write_method" $rostami_no_cache {
    default "1";
    "000"   "0";
}
