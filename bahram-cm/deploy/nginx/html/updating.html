<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="20" />
  <title>در حال بروزرسانی — آکادمی بهرام رستمی</title>
  <style>
    :root {
      --ink: #050a0b;
      --obsidian: #020607;
      --charcoal: #0d1517;
      --emerald: #008c96;
      --emerald-glow: #25a0a6;
      --emerald-deep: #003b40;
      --gold: #ffb000;
      --gold-soft: #ffe08a;
      --bone: #eafbfb;
      --mist: #5f7f83;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      height: 100%;
    }

    body {
      font-family: Tahoma, "Segoe UI", "Iran Sans", sans-serif;
      background: var(--obsidian);
      color: var(--bone);
      overflow: hidden;
      display: grid;
      place-items: center;
      position: relative;
    }

    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0, 140, 150, 0.35), transparent 55%),
        radial-gradient(ellipse 50% 40% at 85% 80%, rgba(255, 176, 0, 0.08), transparent 50%),
        radial-gradient(ellipse 40% 35% at 10% 70%, rgba(37, 160, 166, 0.12), transparent 45%),
        linear-gradient(165deg, #020607 0%, #0a1618 45%, #051012 100%);
      z-index: 0;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(37, 160, 166, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37, 160, 166, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      animation: gridDrift 28s linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes gridDrift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 48px 48px, 48px 48px; }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      z-index: 1;
      pointer-events: none;
      animation: float 9s ease-in-out infinite;
    }

    .orb-a {
      width: 280px; height: 280px;
      background: var(--emerald);
      top: 12%; left: 8%;
      animation-delay: 0s;
    }

    .orb-b {
      width: 220px; height: 220px;
      background: var(--gold);
      opacity: 0.18;
      bottom: 10%; right: 12%;
      animation-delay: -3s;
      animation-duration: 11s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, -22px) scale(1.08); }
    }

    .wrap {
      position: relative;
      z-index: 2;
      width: min(480px, 92vw);
      text-align: center;
      padding: 2.75rem 2rem 2.5rem;
      border-radius: 1.5rem;
      background: rgba(8, 18, 20, 0.55);
      border: 1px solid rgba(37, 160, 166, 0.18);
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset,
        0 0 80px rgba(0, 140, 150, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .brand {
      font-size: clamp(1.45rem, 5.5vw, 2rem);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.01em;
      background: linear-gradient(120deg, var(--bone) 8%, var(--emerald-glow) 48%, var(--gold-soft) 92%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: brandShine 4.5s ease-in-out infinite;
      margin-bottom: 0.4rem;
    }

    @keyframes brandShine {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.12); }
    }

    .tag {
      color: rgba(95, 127, 131, 0.95);
      font-size: 0.72rem;
      margin-bottom: 2rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .ring-wrap {
      position: relative;
      width: 104px;
      height: 104px;
      margin: 0 auto 1.85rem;
    }

    .ring {
      display: block;
      width: 100%;
      height: 100%;
      transform-origin: center;
      animation: ringSpin 1.15s linear infinite;
    }

    .ring-bg {
      fill: none;
      stroke: rgba(37, 160, 166, 0.14);
      stroke-width: 3;
    }

    .ring-fg {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 26 74;
      filter: drop-shadow(0 0 6px rgba(37, 160, 166, 0.5));
    }

    @keyframes ringSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pulse {
      position: absolute;
      inset: 30%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 160, 166, 0.5), transparent 72%);
      animation: pulse 2.2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.88); opacity: 0.55; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    h1 {
      font-size: clamp(1.2rem, 4.2vw, 1.5rem);
      font-weight: 700;
      margin-bottom: 0.7rem;
      line-height: 1.55;
      color: var(--bone);
    }

    p {
      color: var(--mist);
      font-size: 0.93rem;
      line-height: 1.9;
      max-width: 30rem;
      margin: 0 auto 1.65rem;
    }

    .bar {
      height: 3px;
      border-radius: 999px;
      background: rgba(37, 160, 166, 0.12);
      overflow: hidden;
      margin: 0 auto 1.15rem;
      max-width: 200px;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--emerald-deep), var(--emerald-glow), var(--gold));
      background-size: 200% 100%;
      animation: slide 1.5s ease-in-out infinite, shimmer 2.2s linear infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(310%); }
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .hint {
      font-size: 0.76rem;
      color: rgba(95, 127, 131, 0.92);
    }

    .hint strong {
      color: var(--emerald-glow);
      font-weight: 600;
    }

    .dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 3px;
      border-radius: 50%;
      background: var(--emerald-glow);
      animation: bounce 1.2s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-7px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <main class="wrap">
    <div class="brand">آکادمی بهرام رستمی</div>
    <div class="tag">Bahram Rostami Academy</div>

    <div class="ring-wrap" aria-hidden="true">
      <div class="pulse"></div>
      <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#008c96" />
            <stop offset="55%" stop-color="#25a0a6" />
            <stop offset="100%" stop-color="#ffb000" />
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="18" cy="18" r="15.5" />
        <circle class="ring-fg" cx="18" cy="18" r="15.5" pathLength="100" transform="rotate(-90 18 18)" />
      </svg>
    </div>

    <h1>در حال بروزرسانی هستیم</h1>
    <p>
      نسخهٔ جدید سایت در حال نصب است.
      چند لحظه صبر کنید؛ به‌محض آماده شدن، صفحه خودش بازخوانی می‌شود.
    </p>

    <div class="bar" aria-hidden="true"><span></span></div>

    <div class="dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <p class="hint" style="margin-top: 1.25rem; margin-bottom: 0;">
      به‌صورت خودکار هر <strong>۲۰ ثانیه</strong> بررسی می‌شود
    </p>
  </main>

  <script>
    (function () {
      var tries = 0;
      function poke() {
        tries += 1;
        fetch(window.location.pathname + (window.location.search || ""), {
          method: "HEAD",
          cache: "no-store",
          credentials: "same-origin",
        })
          .then(function (r) {
            if (r.ok && r.status < 500) {
              window.location.reload();
            }
          })
          .catch(function () { /* still updating */ });
        if (tries < 90) setTimeout(poke, 8000);
      }
      setTimeout(poke, 8000);
    })();
  </script>
</body>
</html>
