; Laragon / local PHP — copy these into your PHP ini (e.g. Laragon → PHP → php.ini)
; or place as a separate conf.d snippet. Must match production upload limits.
;
; deploy/php-fpm/99-bahram-uploads.ini is the production reference.

upload_max_filesize = 512M
post_max_size = 520M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
